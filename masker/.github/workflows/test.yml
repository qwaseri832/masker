name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests with coverage
        run: go test -cover ./masker/

      - name: Coverage threshold check
        run: |
          COVERAGE=$(go test -coverprofile=coverage.out ./masker/ 2>&1 | grep -oP '\d+\.\d+(?=%)')
          echo "Coverage: $COVERAGE%"
          awk "BEGIN { if ($COVERAGE < 85) { print \"Coverage below 85%\"; exit 1 } }"
