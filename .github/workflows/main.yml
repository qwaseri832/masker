name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'  # ← поменяйте на стабильную версию, не 1.26
      
      - name: Install dependencies
        run: |
          go mod download
          go get github.com/stretchr/testify  # ← добавить
      
      - name: Run tests
        run: go test -v -cover ./...
